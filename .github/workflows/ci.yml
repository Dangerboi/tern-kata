name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The static checks and the tests run as separate jobs, side by side.
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Built with the job's Go: a golangci-lint built with an older Go fails to load a newer toolchain's standard library.
      - run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      # The placement tests run on the Luau command line, pinned to a release.
      - run: |
          curl -fsSL -o luau.zip https://github.com/luau-lang/luau/releases/download/0.745/luau-ubuntu.zip
          echo "186e5ddaa2b048ebc7390c11ed1b00c04e7d3beaffed429250329e3575d2ece2  luau.zip" | sha256sum -c -
          unzip -q luau.zip luau -d "$RUNNER_TEMP/luau"
          chmod +x "$RUNNER_TEMP/luau/luau"
          echo "$RUNNER_TEMP/luau" >> "$GITHUB_PATH"
      - run: scripts/check.sh static
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
      # tern-kata's omp extension (internal/data/ompext) is TypeScript; its tests run under Bun.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun test internal/data/ompext
