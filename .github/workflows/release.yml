name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Build archives (fails if plugin.toml or CHANGELOG.md does not match the tag)
        run: scripts/release.sh "$GITHUB_REF_NAME" dist
      - name: Release notes (the tag's CHANGELOG.md section)
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" > notes.md
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
